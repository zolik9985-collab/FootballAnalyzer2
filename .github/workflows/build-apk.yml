name: Build Football Analyzer 2 APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Extract Android project
        run: |
          mkdir source
          unzip -q ./*.zip -d source

      - name: Build APK
        run: gradle -p source/FootballAnalyzer2 assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: FootballAnalyzer2-APK
          path: source/FootballAnalyzer2/app/build/outputs/apk/debug/app-debug.apk
